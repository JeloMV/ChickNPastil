<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Checkout - Chick N Pastil</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/styles.css">
</head>
<body data-page-header="Order Checkout">
    <div id="topbar-wrapper"></div>
    <div id="sidebar-wrapper"></div>
    <main class="page-container">
        <div class="pos-checkout-layout">
            <section class="checkout-card checkout-details-card">
                <h3>Order Details</h3>
                <form id="checkout-form">
                    <label class="form-label">Order Type</label>
                    <div class="d-flex gap-2 mb-3">
                        <label><input type="radio" name="orderType" value="Dine-In" required> Dine-In</label>
                        <label><input type="radio" name="orderType" value="Takeout" checked> Takeout</label>
                    </div>
                    <label class="form-label" for="customerName">Customer Name</label>
                    <input class="form-control mb-2" id="customerName" name="customerName" placeholder="Optional">
                    <label class="form-label" for="contactNumber">Contact Number</label>
                    <input class="form-control mb-2" id="contactNumber" name="contactNumber" placeholder="Optional">
                    <label class="form-label" for="notes">Other Contacts / Notes</label>
                    <textarea class="form-control mb-3" id="notes" name="notes" placeholder="Optional"></textarea>
                </form>
            </section>

            <section class="checkout-card checkout-summary-card">
                <h3>Order Summary</h3>
                <div id="checkout-items"></div>
                <div class="summary-total">
                    <strong>Total Amount:</strong>
                    <strong id="checkout-total">Php 0.00</strong>
                </div>
            </section>

            <section class="checkout-card checkout-payment-card">
                <h3>Payment</h3>
                <form id="payment-form">
                    <div id="payment-order-total" class="summary-total"></div>
                    <label class="form-label">Payment Type</label>
                    <div class="d-flex gap-3 mb-3">
                        <label><input type="radio" name="paymentMethod" value="Cash" checked> Cash</label>
                        <label><input type="radio" name="paymentMethod" value="GCash"> GCash</label>
                    </div>
                    <label class="form-label" for="amountPaid">Payment Amount</label>
                    <input class="form-control mb-3" id="amountPaid" type="number" min="0" step="0.01" required>
                    <p><strong>Change Amount:</strong> <span id="change-amount">Php 0.00</span></p>
                    <button class="complete-order" type="submit">Complete Order</button>
                    <p id="payment-error" class="text-danger mt-3"></p>
                </form>
            </section>
        </div>
    </main>
    <div class="checkout-modal" id="transaction-modal" hidden>
        <div class="checkout-modal-content" role="dialog" aria-modal="true" aria-labelledby="transaction-modal-title">
            <h3 id="transaction-modal-title">Transaction Recorded</h3>
            <div id="receipt-details"></div>
            <div class="d-flex justify-content-center gap-2 mt-3">
                <button type="button" id="cancel-transaction" class="checkout-modal-cancel">Cancel</button>
                <button type="button" id="print-receipt" class="complete-order">Generate Receipt / PDF</button>
                <button type="button" id="new-order" class="checkout-modal-new-order">New Order</button>
            </div>
        </div>
    </div>
    <script src="../assets/shared/bars.js"></script>
    <script src="checkout.js"></script>
</body>
</html>

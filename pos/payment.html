<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - Chick N Pastil</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/styles.css">
</head>
<body data-page-header="Payment">
    <div id="topbar-wrapper"></div>
    <div id="sidebar-wrapper"></div>
    <main class="page-container">
        <div class="order-summary">
            <h3>Payment</h3>
            <!-- <div id="payment-order-total" class="summary-total"></div> -->
            <form id="payment-form">
                <label class="form-label">Payment Type</label>
                <div class="d-flex gap-3 mb-3">
                    <label><input type="radio" name="paymentMethod" value="Cash" checked> Cash</label>
                    <label><input type="radio" name="paymentMethod" value="GCash"> GCash</label>
                </div>
                <label class="form-label" for="amoun    tPaid">Payment Amount</label>
                <input class="form-control mb-3" id="amountPaid" type="number" min="0" step="0.01" required>
                <button class="complete-order" type="submit">Complete Order</button>
            </form>
            <p id="payment-error" class="text-danger mt-3"></p>
        </div>
    </main>
    <script src="../assets/shared/bars.js"></script>
    <script src="payment.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Selection - Chick N Pastil</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/styles.css">
</head>

<body data-page-header="Order Selection">
    <div id="topbar-wrapper"></div>
    <div id="sidebar-wrapper"></div>

    <main class="page-container">
        <div class="ordering-container">
            <div class="menu">
                <div class="ordering-item"></div>
            </div>

            <section class="order-summary">
                <h3>Order Summary</h3>
                <div class="summary-header">
                    <strong>Item</strong>
                    <strong>Qty</strong>
                </div>
                <div id="summary-items">
                    <p class="empty-summary">No items selected.</p>
                </div>
                <div class="summary-total">
                    <strong>Total Amount:</strong>
                    <strong id="summary-total-amount">Php 0.00</strong>
                </div>
                <button type="button" id="complete-order" class="complete-order" disabled>
                    Complete Order
                </button>
                <div class="attached-logs">
                    <strong>Attached:</strong>
                    <a href="../staff/transaction_logs.html">Today Sales Logs</a>
                </div>
            </section>
        </div>
    </main>

    <script src="../assets/shared/bars.js"></script>
    <script src="order.js"></script>
</body>

</html>

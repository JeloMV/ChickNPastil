<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <h3>Ordering Menu Display</h3>
<!-- Form 1: Add a Section -->
<div class="card">
    <h4>Create New Section (Category)</h4>
    <form id="addSectionForm">
        <input type="text" id="sectionName" placeholder="Section name (e.g. Rice Meals)" required>
        <button type="submit">Add Section</button>
    </form>
</div>

<!-- Form 2: Add an Item to a Section -->
<div class="card">
    <h4>Add Product under a Section</h4>
    <form id="addProductForm">
        <!-- Dropdown populated dynamically with sections -->
        <select id="sectionSelect" required>
            <option value="">Select Section...</option>
        </select>
        <input type="text" id="productName" placeholder="Product name" required>
        <input type="number" id="productPrice" placeholder="Price" step="0.01" required>
        <button type="submit">Add Product</button>
    </form>
</div>

<!-- Table showing Sections & Products -->
<div id="menuTableContainer"></div>
    <script src="menu.js"></script>
</body>

</html>

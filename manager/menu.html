<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Display Management - Chick N Pastil</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/styles.css">
</head>

<body data-page-header="Menu Display Management">
    <div id="topbar-wrapper"></div>
    <div id="sidebar-wrapper"></div>

    <main class="page-container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="fw-bold m-0">Menu Display</h4>
            <a href="dashboard.html" class="btn btn-sm btn-outline-secondary">&larr; Back to Dashboard</a>
        </div>

        <div class="row g-4 mb-4">
            <!-- Form 1: Add a Section -->
            <div class="col-12 col-md-2">
                <div class="card p-3 shadow-sm border-0 rounded-4">
                    <h5 class="fw-bold mb-3">Create New Section</h5>
                    <form id="addSectionForm">
                        <div class="mb-3">
                            <input type="text" id="sectionName" class="form-control" placeholder="Section name (e.g. Rice Meals)" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100 rounded-pill">Add Section</button>
                    </form>
                </div>
            </div>

            <!-- Form 2: Add an Item to a Section -->
            <div class="col-12 col-md-3">
                <div class="card p-3 shadow-sm border-0 rounded-4">
                    <h5 class="fw-bold mb-3">Add Product under Section</h5>
                    <form id="addProductForm">
                        <div class="row g-2 mb-3">
                            <div class="col-12 col-sm-6">
                                <select id="sectionSelect" class="form-select" required>
                                    <option value="">Select Section...</option>
                                </select>
                            </div>
                            <div class="col-12 col-sm-6">
                                <input type="text" id="productName" class="form-control" placeholder="Product name" required>
                            </div>
                            <div class="col-12">
                                <input type="number" id="productPrice" class="form-control" placeholder="Price (Php)" step="0.01" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success w-100 rounded-pill">Add Product</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Dynamic Menu Sections & Table Container -->
        <div id="menuTableContainer" class="menu-tables-wrapper"></div>
    </main>

    <script src="../assets/shared/bars.js"></script>
    <script src="menu.js"></script>
</body>

</html>

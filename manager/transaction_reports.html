<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction History - Chick N Pastil</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/styles.css">
</head>
<body data-page-header="Transaction History">
    <div id="topbar-wrapper"></div>
    <div id="sidebar-wrapper"></div>

    <main class="page-container">
        <!-- Top Toolbar: Search & Export -->
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
            <div class="search-box-wrapper">
                <i class="bi bi-search search-icon"></i>
                <input type="text" class="search-input" placeholder="Search transactions...">
            </div>
            <div class="d-flex gap-2">
                <button type="button" class="btn-export-report">Export CSV</button>
                <button type="button" class="btn-export-report" id="print-report">Print / PDF</button>
            </div>
        </div>

        <h4 class="fw-bold mb-3">Recent Transactions</h4>

        <!-- Transactions Table -->
        <div class="table-responsive">
            <table class="manager-transactions-table">
                <thead>
                    <tr>
                        <th>Payment ID</th>
                        <th>Customer Name</th>
                        <th>Order Amount</th>
                        <th>Contact No.</th>
                        <th>Status</th>
                        <th>Notes</th>
                        <th>Date and Time</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="transaction-table-body">
                    <tr>
                        <td colspan="8">Loading transactions...</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div class="d-flex justify-content-end align-items-center gap-2 mt-4">
            <button type="button" class="pagination-arrow" aria-label="Previous Page">&#9664;</button>
            <span class="fw-bold">Page 1</span>
            <button type="button" class="pagination-arrow" aria-label="Next Page">&#9654;</button>
        </div>
    </main>

    <script src="../assets/shared/bars.js"></script>
    <script src="transaction_reports.js"></script>
    <script>
        document.getElementById('print-report').addEventListener('click', () => window.print());
    </script>
</body>
</html>

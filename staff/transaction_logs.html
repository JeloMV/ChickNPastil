<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction History - Chick N Pastil</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/styles.css">
</head>
<body data-page-header="Transaction History">
    <div id="topbar-wrapper"></div>
    <div id="sidebar-wrapper"></div>

    <main class="page-container">
        <div class="transaction-history-card">
            <h4 class="text-center fw-bold mb-3">Recent Sales</h4>

            <!-- Filter tabs -->
            <div class="d-flex justify-content-center gap-2 mb-4">
                <button type="button" class="filter-pill active">All</button>
                <button type="button" class="filter-pill">For payment</button>
                <button type="button" class="filter-pill">Completed</button>
            </div>

            <!-- Transaction Cards List -->
            <div id="transaction-list" class="transaction-list mb-4">
                <p>Loading transactions...</p>
            </div>

            <!-- Bottom Actions & Pagination -->
            <div class="d-flex flex-column align-items-center gap-3">
                <button type="button" class="btn-export-report" id="export-report">Export CSV</button>
                <div class="pagination-controls d-flex align-items-center gap-2">
                    <button type="button" class="pagination-arrow" aria-label="Previous Page">&#9664;</button>
                    <span class="fw-bold">Page 1</span>
                    <button type="button" class="pagination-arrow" aria-label="Next Page">&#9654;</button>
                </div>
            </div>
        </div>
    </main>

    <script src="../assets/shared/bars.js"></script>
    <script src="transaction_logs.js"></script>
</body>
</html>
